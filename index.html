<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie risorse</title>
<style>
  :root {
    --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff;
    --line: #e4e4de; --accent: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161715; --fg: #ececE6; --muted: #9a9a92; --card: #1f201e; --line: #2e2f2c; --accent: #7fb5a3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { margin: 0 0 6px; font-size: 1.9rem; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  input[type=search] { flex: 1 1 240px; padding: 10px 12px; border-radius: 8px;
         border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--fg);
          padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .9rem; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 18px 20px; margin-bottom: 14px; }
  .card h2 { margin: 0; font-size: 1.15rem; }
  .card h2 a { color: var(--fg); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  .cat { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .desc { color: var(--muted); margin: 4px 0 10px; }
  .card ul { margin: 0; padding-left: 20px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1 id="titolo">Le mie risorse</h1>
  <p class="sub" id="descrizione"></p>
  <div class="controls">
    <input type="search" id="q" placeholder="Cerca per nome, categoria o caso d'uso…" aria-label="Cerca">
  </div>
  <div class="chips" id="chips" style="margin-bottom:22px"></div>
  <div id="lista"></div>
</main>
<script>
(async function () {
  const lista = document.getElementById('lista');
  const chips = document.getElementById('chips');
  const q = document.getElementById('q');
  let dati, categoria = null;

  try {
    const r = await fetch('risorse.json', { cache: 'no-cache' });
    dati = await r.json();
  } catch (e) {
    lista.innerHTML = '<p class="empty">Impossibile caricare la lista.</p>';
    return;
  }

  document.getElementById('titolo').textContent = dati.titolo || 'Le mie risorse';
  document.title = dati.titolo || 'Le mie risorse';
  document.getElementById('descrizione').textContent = dati.descrizione || '';

  const risorse = dati.risorse || [];
  const categorie = [...new Set(risorse.map(r => r.categoria).filter(Boolean))].sort();

  function el(tag, attrs, text) {
    const n = document.createElement(tag);
    for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function disegnaChips() {
    chips.innerHTML = '';
    if (!categorie.length) return;
    [null, ...categorie].forEach(c => {
      const b = el('button', { class: 'chip', 'aria-pressed': String(c === categoria) }, c || 'Tutte');
      b.onclick = () => { categoria = c; disegnaChips(); disegna(); };
      chips.appendChild(b);
    });
  }

  function disegna() {
    const t = q.value.trim().toLowerCase();
    const filtrate = risorse.filter(r => {
      if (categoria && r.categoria !== categoria) return false;
      if (!t) return true;
      const testo = [r.nome, r.categoria, r.descrizione, ...(r.casi_uso || [])].join(' ').toLowerCase();
      return testo.includes(t);
    });
    lista.innerHTML = '';
    if (!filtrate.length) {
      lista.appendChild(el('p', { class: 'empty' }, risorse.length ? 'Nessun risultato.' : 'Nessuna risorsa ancora: la lista è in costruzione.'));
      return;
    }
    filtrate.forEach(r => {
      const card = el('article', { class: 'card' });
      if (r.categoria) card.appendChild(el('div', { class: 'cat' }, r.categoria));
      const h = el('h2');
      if (r.url && /^https?:\/\//i.test(r.url)) {
        h.appendChild(el('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer' }, r.nome));
      } else {
        h.textContent = r.nome;
      }
      card.appendChild(h);
      if (r.descrizione) card.appendChild(el('p', { class: 'desc' }, r.descrizione));
      if (r.casi_uso && r.casi_uso.length) {
        const ul = el('ul');
        r.casi_uso.forEach(c => ul.appendChild(el('li', null, c)));
        card.appendChild(ul);
      }
      lista.appendChild(card);
    });
  }

  q.addEventListener('input', disegna);
  disegnaChips();
  disegna();
})();
</script>
</body>
</html>
